<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Investasi</title>
    <!-- Google Font untuk tampilan lebih elegan -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* Reset & dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 20, 30, 0.12), 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        h1 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #0b2b3b;
            margin-bottom: 6px;
        }

        .subhead {
            font-size: 15px;
            color: #4e6b7a;
            font-weight: 400;
            border-left: 4px solid #2f8f9f;
            padding-left: 14px;
            margin-bottom: 30px;
            background: rgba(47, 143, 159, 0.04);
            border-radius: 0 12px 12px 0;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #1a3b4a;
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 60px;
            padding: 0 20px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
        }

        .input-wrapper:focus-within {
            border-color: #2f8f9f;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 0 4px rgba(47, 143, 159, 0.15);
        }

        .input-wrapper span {
            font-size: 16px;
            font-weight: 500;
            color: #1e4a5c;
            margin-right: 10px;
            opacity: 0.7;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 0;
            border: none;
            background: transparent;
            font-size: 17px;
            font-weight: 450;
            color: #0b2b3b;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-wrapper input::placeholder {
            color: #a0b9c7;
            font-weight: 350;
            font-size: 15px;
        }

        /* Hilangkan spinner number */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .hint {
            font-size: 13px;
            color: #6d8b9b;
            margin-top: 6px;
            padding-left: 6px;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            gap: 14px;
            margin-top: 14px;
        }

        .btn {
            flex: 1;
            padding: 16px 12px;
            border: none;
            border-radius: 60px;
            font-size: 17px;
            font-weight: 500;
            background: #eef3f7;
            color: #1a3b4a;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.01em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .btn-primary {
            background: #1a4d5e;
            color: white;
            box-shadow: 0 8px 18px rgba(26, 77, 94, 0.20);
        }

        .btn-primary:hover {
            background: #0f3e4e;
            transform: scale(0.98);
            box-shadow: 0 6px 14px rgba(26, 77, 94, 0.25);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 32px;
            padding: 24px 22px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: inset 0 1px 4px rgba(255,255,255,0.8);
            transition: opacity 0.3s ease;
        }

        .result-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #4a6d7e;
            font-weight: 500;
        }

        .result-value {
            font-size: 36px;
            font-weight: 550;
            color: #0b2b3b;
            margin-top: 6px;
            letter-spacing: -0.02em;
            word-break: break-word;
        }

        .result-detail {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            border-top: 1px solid rgba(0,0,0,0.04);
            padding-top: 16px;
            font-size: 14px;
            color: #2c5568;
        }

        .result-detail span:last-child {
            font-weight: 500;
            color: #0b2b3b;
        }

        .empty-state {
            color: #6a8b9c;
            font-weight: 400;
        }

        /* responsif */
        @media (max-width: 480px) {
            .card { padding: 28px 18px; }
            h1 { font-size: 24px; }
            .result-value { font-size: 28px; }
            .btn { font-size: 15px; padding: 14px 10px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📈 Kalkulator Investasi</h1>
        <div class="subhead">Future Value · FV = PV × (1 + r)^n</div>

        <div class="form-group">
            <label for="pv">Modal Awal (PV)</label>
            <div class="input-wrapper">
                <span>Rp</span>
                <input type="number" id="pv" placeholder="Contoh: 10.000.000" step="any" />
            </div>
        </div>

        <div class="form-group">
            <label for="rate">Tingkat Pengembalian (r)</label>
            <div class="input-wrapper">
                <span>%</span>
                <input type="number" id="rate" placeholder="Contoh: 8.5" step="any" />
            </div>
            <div class="hint">Masukkan dalam persen per periode</div>
        </div>

        <div class="form-group">
            <label for="period">Jumlah Periode (n)</label>
            <div class="input-wrapper">
                <span>tahun</span>
                <input type="number" id="period" placeholder="Contoh: 10" step="1" min="0" />
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="calculateBtn">Hitung FV</button>
            <button class="btn btn-secondary" id="clearBtn">Reset</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-label">Nilai Masa Depan (FV)</div>
            <div class="result-value" id="fvDisplay">—</div>
            <div class="result-detail">
                <span>Total pertumbuhan</span>
                <span id="growthDisplay">—</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // DOM elements
            const pvInput = document.getElementById('pv');
            const rateInput = document.getElementById('rate');
            const periodInput = document.getElementById('period');
            const calculateBtn = document.getElementById('calculateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const fvDisplay = document.getElementById('fvDisplay');
            const growthDisplay = document.getElementById('growthDisplay');

            // Fungsi format Rupiah (tanpa desimal untuk tampilan bersih)
            function formatRupiah(angka) {
                if (angka === undefined || angka === null || isNaN(angka)) return '—';
                const rounded = Math.round(angka);
                return 'Rp ' + rounded.toLocaleString('id-ID');
            }

            // Fungsi format persentase (1 desimal)
            function formatPercent(value) {
                if (value === undefined || value === null || isNaN(value)) return '—';
                return value.toFixed(1) + '%';
            }

            // Fungsi utama menghitung FV
            function calculateFV() {
                // Ambil nilai dan parse
                const pv = parseFloat(pvInput.value.replace(/,/g, '').trim());
                const ratePercent = parseFloat(rateInput.value.replace(/,/g, '').trim());
                const period = parseInt(periodInput.value.trim(), 10);

                // Validasi input
                if (isNaN(pv) || pv < 0) {
                    fvDisplay.textContent = '⚠️ PV tidak valid';
                    growthDisplay.textContent = '—';
                    return;
                }
                if (isNaN(ratePercent) || ratePercent < 0) {
                    fvDisplay.textContent = '⚠️ Rate harus ≥ 0';
                    growthDisplay.textContent = '—';
                    return;
                }
                if (isNaN(period) || period < 0 || !Number.isInteger(period)) {
                    fvDisplay.textContent = '⚠️ Periode harus ≥ 0';
                    growthDisplay.textContent = '—';
                    return;
                }

                // Konversi rate ke desimal
                const r = ratePercent / 100;

                // Rumus FV = PV × (1 + r)^n
                const fv = pv * Math.pow((1 + r), period);

                // Hitung total pertumbuhan (dalam persen)
                let growthPercent = 0;
                if (pv !== 0) {
                    growthPercent = ((fv - pv) / pv) * 100;
                } else {
                    growthPercent = 0;
                }

                // Tampilkan hasil
                fvDisplay.textContent = formatRupiah(fv);
                growthDisplay.textContent = growthPercent >= 0 ? `+ ${formatPercent(growthPercent)}` : `${formatPercent(growthPercent)}`;
            }

            // Fungsi reset (clear)
            function resetCalculator() {
                pvInput.value = '';
                rateInput.value = '';
                periodInput.value = '';
                fvDisplay.textContent = '—';
                growthDisplay.textContent = '—';
                // Fokus ke input pertama
                pvInput.focus();
            }

            // Event listeners
            calculateBtn.addEventListener('click', calculateFV);

            clearBtn.addEventListener('click', resetCalculator);

            // Enter key pada input memicu hitung
            const inputs = [pvInput, rateInput, periodInput];
            inputs.forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        calculateFV();
                    }
                });
            });

            // Opsional: format saat kehilangan fokus (bersihkan koma)
            pvInput.addEventListener('blur', function() {
                if (this.value) {
                    const raw = this.value.replace(/,/g, '');
                    if (!isNaN(parseFloat(raw))) {
                        // biarkan sebagai angka, tidak diformat agar mudah diedit
                        this.value = raw;
                    }
                }
            });

            // Saat load, fokus ke PV
            window.addEventListener('load', () => {
                pvInput.focus();
            });
        })();
    </script>
</body>
</html>
